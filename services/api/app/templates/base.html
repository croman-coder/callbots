<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Callbot{% endblock %}</title>
<style>
/* Callbot — panel de operaciones.
 *
 * La interfaz es monocromática y cálida. Lo único saturado en pantalla son los
 * estados: si algo tiene color, es porque pide una decisión. Eso deja que la
 * lista de seguimiento se imponga sola, sin competir con seis tarjetas de
 * colores.
 *
 * Sin fuentes web ni nada por CDN: herramienta interna, una dependencia
 * externa que bloquea el render no compra nada.
 */
:root {
  color-scheme: light;

  /* Neutros templados hacia el ámbar. Ningún gris es puro, ningún extremo es
     #fff ni #000: a plena saturación de blanco la pantalla cansa. */
  --paper:      oklch(98.6% 0.003 85);
  --surface:    oklch(99.4% 0.002 85);
  --panel:      oklch(96.6% 0.005 82);   /* barra lateral: capa aparte */
  --raised:     oklch(97.4% 0.004 85);

  --ink:        oklch(23% 0.009 75);
  --ink-2:      oklch(43% 0.011 75);
  --ink-3:      oklch(57% 0.012 78);

  --line:       oklch(91% 0.006 82);
  --line-2:     oklch(85% 0.008 82);

  /* Lo interactivo se marca con contraste, no con un tinte de marca. El
     "acento" es la tinta misma. */
  --active:     oklch(23% 0.009 75);
  --active-ink: oklch(98.6% 0.003 85);
  --active-soft:oklch(93% 0.006 82);

  /* Único lugar con croma real. */
  --ok:         oklch(50% 0.13 150);
  --ok-bg:      oklch(95.5% 0.04 150);
  --warn:       oklch(53% 0.12 68);
  --warn-bg:    oklch(95.5% 0.045 75);
  --bad:        oklch(50% 0.18 25);
  --bad-bg:     oklch(95.5% 0.04 25);
  --live:       oklch(52% 0.13 250);
  --live-bg:    oklch(95.5% 0.035 250);

  --s1:4px; --s2:8px; --s3:12px; --s4:16px;
  --s5:20px; --s6:28px; --s7:40px; --s8:56px;

  --t-xs:11px; --t-sm:12.5px; --t-base:14px;
  --t-md:16px; --t-lg:19px; --t-xl:23px; --t-3xl:34px;

  --r-sm:6px; --r:9px; --r-lg:13px;

  /* ease-out exponencial: arranca rápido y frena. Sin rebote. */
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur:  180ms;
  --dur-fast: 110ms;

  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;

  --sidebar-w: 232px;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper:      oklch(17.5% 0.008 75);
    --surface:    oklch(21% 0.009 75);
    --panel:      oklch(19% 0.009 75);
    --raised:     oklch(24.5% 0.011 75);

    --ink:        oklch(94% 0.005 85);
    --ink-2:      oklch(76% 0.009 82);
    --ink-3:      oklch(61% 0.011 80);

    --line:       oklch(28% 0.011 75);
    --line-2:     oklch(37% 0.013 75);

    --active:     oklch(94% 0.005 85);
    --active-ink: oklch(17.5% 0.008 75);
    --active-soft:oklch(27% 0.012 75);

    --ok:   oklch(76% 0.15 150);  --ok-bg:   oklch(28% 0.055 150);
    --warn: oklch(79% 0.13 75);   --warn-bg: oklch(29% 0.05 70);
    --bad:  oklch(70% 0.16 25);   --bad-bg:  oklch(28% 0.065 25);
    --live: oklch(74% 0.12 250);  --live-bg: oklch(28% 0.055 250);
  }
}

*,*::before,*::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: var(--t-base)/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }

:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* ═══════════════════════════════════════════════════ estructura */
.shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100dvh; }

.side {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100dvh;
}

.mark {
  display: flex; align-items: center; gap: var(--s2);
  padding: var(--s5) var(--s4) var(--s4);
  font-weight: 600; letter-spacing: -0.015em; font-size: var(--t-md);
}
.pulse {
  width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
  box-shadow: 0 0 0 3px var(--ok-bg); flex: none;
}

.side nav { padding: 0 var(--s2); display: flex; flex-direction: column; gap: 1px; }
.side nav .group {
  padding: var(--s4) var(--s2) var(--s1);
  font-size: var(--t-xs); font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--ink-3);
}
.side nav a {
  display: flex; align-items: center; gap: var(--s2);
  padding: 7px var(--s2); border-radius: var(--r-sm);
  color: var(--ink-2); font-size: var(--t-sm); font-weight: 500;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.side nav a:hover { background: var(--active-soft); color: var(--ink); }
/* La selección se marca con contraste, no con una barrita al costado. */
.side nav a[aria-current="page"] {
  background: var(--active); color: var(--active-ink); font-weight: 550;
}
.side nav a svg { width: 15px; height: 15px; flex: none; opacity: 0.85; }

.side-foot { margin-top: auto; padding: var(--s4); border-top: 1px solid var(--line); }

.content { min-width: 0; display: flex; flex-direction: column; }

.bar {
  display: flex; align-items: center; gap: var(--s4);
  padding: var(--s5) var(--s6);
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  position: sticky; top: 0; z-index: 10;
  flex-wrap: wrap;
}
.bar h1 { font-size: var(--t-lg); font-weight: 620; letter-spacing: -0.02em; margin: 0; }
.bar .lede { color: var(--ink-3); font-size: var(--t-sm); margin: 1px 0 0; }
.bar .right { margin-left: auto; display: flex; gap: var(--s2); align-items: center; }

.wrap { padding: var(--s6); max-width: 1360px; width: 100%; }

/* ═══════════════════════════════════════════════════ tipografía */
h2 { font-size: var(--t-md); font-weight: 600; letter-spacing: -0.012em; margin: 0; }
h3 { font-size: var(--t-base); font-weight: 600; margin: 0; }
.muted { color: var(--ink-3); }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 0.92em; letter-spacing: -0.01em; }

/* ═══════════════════════════════════════════════════ secciones */
/* Sin tarjeta: un título con una regla debajo separa igual de bien y no mete
   una caja dentro de otra caja. */
.section { margin-bottom: var(--s7); }
.section > header {
  display: flex; align-items: baseline; gap: var(--s3);
  padding-bottom: var(--s3); margin-bottom: var(--s4);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.section > header .note { color: var(--ink-3); font-size: var(--t-sm); }
.section > header .right { margin-left: auto; }

/* Bloque que reclama atención: borde completo y fondo teñido. Nunca una franja
   al costado. */
.urgent {
  border: 1px solid var(--bad); border-radius: var(--r-lg);
  background: var(--surface); overflow: hidden;
  margin-bottom: var(--s7);
}
.urgent > header {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s4) var(--s5);
  background: var(--bad-bg); color: var(--bad);
  border-bottom: 1px solid var(--bad);
  flex-wrap: wrap;
}
.urgent > header h2 { font-size: var(--t-base); color: inherit; }
.urgent > header .note { font-size: var(--t-sm); opacity: 0.85; margin-left: auto; }

/* ═══════════════════════════════════════════════════ métricas */
/* Tira con divisores, no seis cajas iguales. La caja no aporta nada acá y
   convierte cualquier panel en "admin genérico". */
.metrics {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
  border: 1px solid var(--line); border-radius: var(--r-lg);
  background: var(--surface); overflow: hidden;
  margin-bottom: var(--s7);
}
.metric {
  padding: var(--s4) var(--s5);
  border-right: 1px solid var(--line);
  min-width: 0;
}
.metric:last-child { border-right: 0; }
.metric .k {
  font-size: var(--t-xs); font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px;
}
.metric .v {
  font-size: var(--t-xl); font-weight: 620; letter-spacing: -0.03em; line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.metric .v small { font-size: var(--t-sm); font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
.metric .f { font-size: var(--t-xs); color: var(--ink-3); margin-top: 4px; }
.metric.hero { grid-column: span 2; background: var(--raised); }
.metric.hero .v { font-size: var(--t-3xl); }
.metric.is-bad .v { color: var(--bad); }
@media (max-width: 620px) { .metric.hero { grid-column: span 1; } }

/* ═══════════════════════════════════════════════════ tablas */
.tablewrap {
  border: 1px solid var(--line); border-radius: var(--r-lg);
  background: var(--surface); overflow: hidden;
}
.urgent .tablewrap, .tablewrap.bare { border: 0; border-radius: 0; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
thead th {
  text-align: left; padding: var(--s2) var(--s4);
  font-size: var(--t-xs); font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3);
  background: var(--raised); border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
tbody td { padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background var(--dur-fast) var(--ease); }
tbody tr:hover { background: var(--raised); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.name { font-weight: 550; }

/* ═══════════════════════════════════════════════════ estados */
/* Texto siempre; el punto es refuerzo, no la señal. */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px 2px 6px; border-radius: 20px;
  font-size: var(--t-xs); font-weight: 600;
  background: var(--active-soft); color: var(--ink-2);
  white-space: nowrap;
}
.pill::before { content:""; width:5px; height:5px; border-radius:50%; background: currentColor; flex:none; }
.pill.completed, .pill.positivo  { background: var(--ok-bg);   color: var(--ok); }
.pill.pending, .pill.scheduled,
.pill.queued, .pill.neutral,
.pill.partial                    { background: var(--warn-bg); color: var(--warn); }
.pill.calling                    { background: var(--live-bg); color: var(--live); }
.pill.failed, .pill.no_answer,
.pill.opted_out, .pill.negativo  { background: var(--bad-bg);  color: var(--bad); }

.flag { color: var(--bad); font-weight: 700; }
.score-bad { color: var(--bad); font-weight: 620; }

/* ═══════════════════════════════════════════════════ gráfico de barras */
.chart { display: flex; flex-direction: column; gap: var(--s3); }
.chart-row { display: grid; grid-template-columns: minmax(0,1fr) 92px; gap: var(--s4); align-items: center; }
.chart-row .lbl { font-size: var(--t-sm); min-width: 0; }
.chart-row .track {
  height: 22px; background: var(--active-soft); border-radius: var(--r-sm);
  overflow: hidden; margin-top: 5px;
}
.chart-row .fill { display: block; height: 100%; background: var(--ok); border-radius: var(--r-sm); }
.chart-row .fill.low { background: var(--bad); }
.chart-row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 620; }
.chart-row .val small { display:block; font-weight:400; font-size: var(--t-xs); color: var(--ink-3); }

/* ═══════════════════════════════════════════════════ controles */
button, .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px var(--s4); min-height: 36px;
  border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink);
  font: inherit; font-size: var(--t-sm); font-weight: 550;
  cursor: pointer; white-space: nowrap;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
button:hover:not(:disabled), .btn:hover { background: var(--raised); }
button:active:not(:disabled) { background: var(--active-soft); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: var(--active); border-color: var(--active); color: var(--active-ink); }
button.primary:hover:not(:disabled) { opacity: 0.88; }
button.danger { color: var(--bad); }
button.danger:hover:not(:disabled) { background: var(--bad-bg); border-color: var(--bad); }
button.mini, .btn.mini { padding: 3px var(--s2); min-height: 0; font-size: var(--t-xs); }
.link { color: var(--ink-2); font-weight: 550; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.link:hover { color: var(--ink); text-decoration-color: currentColor; }

label { display: block; font-size: var(--t-sm); font-weight: 600; margin: var(--s4) 0 5px; }
label .hint, .hint { font-weight: 400; color: var(--ink-3); font-size: var(--t-sm); }
input[type=text],input[type=number],input[type=time],input[type=password],select,textarea {
  width: 100%; padding: 8px var(--s3); min-height: 38px;
  border: 1px solid var(--line-2); border-radius: var(--r-sm);
  font: inherit; background: var(--surface); color: var(--ink);
  transition: border-color var(--dur-fast) var(--ease);
}
input:hover:not(:disabled),select:hover:not(:disabled),textarea:hover:not(:disabled) { border-color: var(--ink-3); }
input:disabled,select:disabled,textarea:disabled { opacity:.5; cursor:not-allowed; background: var(--raised); }
textarea { min-height: 80px; resize: vertical; }
.row { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); }
.check { display:flex; align-items:center; gap: var(--s2); margin-top: var(--s4); font-size: var(--t-sm); }
.check input { width:auto; min-height:0; }
.actions { display:flex; gap: var(--s2); flex-wrap:wrap; align-items:center; margin-top: var(--s5); }
.inline { display:inline; }

.empty { padding: var(--s8) var(--s5); text-align:center; color: var(--ink-3); }
.empty strong { display:block; color: var(--ink); font-weight:600; margin-bottom: 5px; font-size: var(--t-base); }
code { background: var(--active-soft); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: .9em; }

.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path: inset(50%); white-space:nowrap; border:0; }

/* Compatibilidad con las pantallas que todavía no se rehicieron. */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: var(--s5); margin-bottom: var(--s5);
}
.card > h2:first-child { margin-bottom: var(--s3); }
.card > h2:not(:first-child) { margin-top: var(--s5); margin-bottom: var(--s3); }
.grid { display:grid; gap: var(--s3); grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); margin-bottom: var(--s5); }
.kpi { background: var(--surface); border:1px solid var(--line); border-radius: var(--r); padding: var(--s4); }
.kpi .n { font-size: var(--t-xl); font-weight:620; letter-spacing:-.03em; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--ink-3); font-size: var(--t-sm); }
.tag { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px; font-size: var(--t-xs); font-weight:600; background: var(--active-soft); color: var(--ink-2); white-space:nowrap; }
.tag.completed,.tag.positivo { background: var(--ok-bg); color: var(--ok); }
.tag.pending,.tag.scheduled,.tag.queued,.tag.neutral { background: var(--warn-bg); color: var(--warn); }
.tag.calling { background: var(--live-bg); color: var(--live); }
.tag.failed,.tag.no_answer,.tag.opted_out,.tag.negativo { background: var(--bad-bg); color: var(--bad); }
.sub { color: var(--ink-3); font-size: var(--t-sm); margin: 2px 0 var(--s5); }

/* ═══════════════════════════════════════════════════ responsive */
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side {
    position: static; height: auto; flex-direction: row; align-items: center;
    gap: var(--s2); border-right: 0; border-bottom: 1px solid var(--line);
    overflow-x: auto; padding-right: var(--s3);
  }
  .mark { padding: var(--s3) var(--s4); }
  .side nav { flex-direction: row; padding: 0; gap: var(--s1); }
  .side nav .group, .side-foot { display: none; }
  .side nav a { white-space: nowrap; }
  .bar, .wrap { padding-left: var(--s4); padding-right: var(--s4); }
}

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="mark"><span class="pulse" aria-hidden="true"></span>Callbot</div>
    <nav aria-label="Secciones">
      <span class="group">Operación</span>
      <a href="/" {% if nav=='dashboard' %}aria-current="page"{% endif %}>Resultados</a>
      <a href="/targets" {% if nav=='targets' %}aria-current="page"{% endif %}>Destinatarios</a>
      <span class="group">Configuración</span>
      <a href="/campaigns" {% if nav=='campaigns' %}aria-current="page"{% endif %}>Campañas</a>
      <a href="/voices" {% if nav=='voices' %}aria-current="page"{% endif %}>Voz</a>
      <span class="group">Herramientas</span>
      <a href="/simulador" {% if nav=='simulador' %}aria-current="page"{% endif %}>Simulador</a>
      <a href="/health-detail" {% if nav=='health' %}aria-current="page"{% endif %}>Diagnóstico</a>
    </nav>
    <div class="side-foot">
      <form method="post" action="/sync-now">
        <button type="submit" style="width:100%">Sincronizar Bitrix</button>
      </form>
    </div>
  </aside>

  <div class="content">
    {% block topbar %}{% endblock %}
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
</body>
</html>
