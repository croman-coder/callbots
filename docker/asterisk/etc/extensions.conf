;==============================================================================
; Dialplan - Callbot
;
; Nota: envsubst solo reemplaza ${AUDIOSOCKET_HOST} y ${AUDIOSOCKET_PORT}.
; Las demás ${...} son variables de canal de Asterisk y quedan intactas.
;==============================================================================

[general]
static = yes
writeprotect = yes

[globals]
AUDIOSOCKET_TARGET = ${AUDIOSOCKET_HOST}:${AUDIOSOCKET_PORT}

;------------------------------------------------------------------------------
; Contexto al que entra el canal originado por ARI cuando el cliente ATIENDE.
; La API pasa SESSION_UUID como variable de canal en el originate.
;------------------------------------------------------------------------------
[callbot-outbound]

exten => start,1,NoOp(=== CALLBOT: sesion ${SESSION_UUID} hacia ${CALLERID(dnid)} ===)
    same => n,Set(CHANNEL(hangup_handler_push)=callbot-hangup,s,1)
    same => n,Answer()
    ; Pequeña pausa: si hablamos apenas atienden, el cliente se pierde el inicio.
    same => n,Wait(1)
    same => n,Verbose(1,Conectando AudioSocket a ${AUDIOSOCKET_TARGET})
    same => n,AudioSocket(${SESSION_UUID},${AUDIOSOCKET_TARGET})
    same => n,Verbose(1,AudioSocket finalizado - status ${AUDIOSOCKETSTATUS})
    same => n,Hangup()

; Variante para los agentes con transferencia a un asesor (la API la elige al originar; el resto de los
; agentes sigue por `start`, sin tocar).
;
; En el Asterisk 18 de la imagen, cuando el voice-agent cierra el AudioSocket la app devuelve error y
; CUELGA el canal donde corre, así que el dialplan no puede seguir después. Por eso acá el bot corre en
; un canal Local (callbot-bot) y el canal del cliente espera en un Dial(): al cerrarse el bot, el canal
; del cliente sigue vivo. Si la API dejó TRANSFER_<sesión> (variable global, por ARI), se marca al asesor;
; si no, se corta como siempre.
exten => start_transferible,1,NoOp(=== CALLBOT: sesion ${SESSION_UUID} (con transferencia) hacia ${CALLERID(dnid)} ===)
    same => n,Set(CHANNEL(hangup_handler_push)=callbot-hangup,s,1)
    same => n,Answer()
    same => n,Wait(1)
    ; «g»: si quien cuelga es el bot, el canal del cliente SIGUE en el dialplan (sin esto, Dial lo cuelga).
    same => n,Dial(Local/${SESSION_UUID}@callbot-bot/n,,g)
    same => n,Verbose(1,El bot termino - ${DIALSTATUS})
    same => n,GotoIf($["${GLOBAL(TRANSFER_${SESSION_UUID})}" != ""]?transfer,1)
    same => n,Hangup()

; Pasa la llamada a un asesor. Dial() une las dos puntas: el cliente queda hablando con él. La «r» hace
; sonar el tono de llamada mientras tanto. Si el asesor no atiende, la llamada se corta.
exten => transfer,1,Set(DESTINO_ASESOR=${GLOBAL(TRANSFER_${SESSION_UUID})})
    same => n,Set(GLOBAL(TRANSFER_${SESSION_UUID})=)
    same => n,NoOp(=== CALLBOT: transfiriendo sesion ${SESSION_UUID} a ${DESTINO_ASESOR} ===)
    same => n,Dial(${DESTINO_ASESOR},30,r)
    same => n,NoOp(=== CALLBOT: fin de la transferencia - ${DIALSTATUS} ===)
    same => n,Hangup()

; Si el AudioSocket falla, cortamos sin dejar el canal colgado
exten => failed,1,NoOp(=== CALLBOT: fallo en sesion ${SESSION_UUID} ===)
    same => n,Hangup()

;------------------------------------------------------------------------------
; Canal Local donde corre el audio del bot en la variante con transferencia: la extensión es la sesión.
;------------------------------------------------------------------------------
[callbot-bot]
exten => _[0-9a-f].,1,NoOp(=== CALLBOT: bot de la sesion ${EXTEN} ===)
    ; Un canal Local nace sin atender: AudioSocket falla con «Channel is not answered» si no se atiende acá.
    same => n,Answer()
    same => n,AudioSocket(${EXTEN},${AUDIOSOCKET_TARGET})
    same => n,Hangup()

;------------------------------------------------------------------------------
; Handler de colgado: deja rastro en el log con la causa real.
; La API se entera del fin por los eventos ARI, no por acá.
;------------------------------------------------------------------------------
[callbot-hangup]
exten => s,1,NoOp(=== CALLBOT hangup: sesion=${SESSION_UUID} causa=${HANGUPCAUSE} dialstatus=${DIALSTATUS} ===)
    same => n,Return()

;------------------------------------------------------------------------------
; Contexto de los softphones registrados.
;------------------------------------------------------------------------------
[callbot-inbound]

; 9000 -> encuesta de prueba. El voice-agent reconoce el UUID nulo y corre la
; campaña activa en modo demo, sin tocar Bitrix ni marcar nada como completado.
exten => 9000,1,NoOp(=== CALLBOT: prueba manual de encuesta ===)
    same => n,Answer()
    same => n,Wait(1)
    same => n,AudioSocket(00000000-0000-0000-0000-000000000000,${AUDIOSOCKET_TARGET})
    same => n,Hangup()

; 9001 -> eco, para verificar audio bidireccional y latencia del softphone
exten => 9001,1,Answer()
    same => n,Echo()
    same => n,Hangup()

; 1001 / 1002 -> llamadas entre softphones (útil para validar el registro SIP)
exten => _100X,1,NoOp(Llamada interna a softphone-${EXTEN:3})
    same => n,Dial(PJSIP/softphone-${EXTEN:3},30)
    same => n,Hangup()

exten => i,1,Playback(invalid)
    same => n,Hangup()

exten => t,1,Hangup()
