;==============================================================================
; PJSIP - Callbot
;
; DEV : endpoints "softphone-1" y "softphone-2" para probar con Linphone/Zoiper
; PROD: descomentar el bloque de troncal y setear TRUNK_* en el .env
;==============================================================================

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; El entrypoint rellena esto con external_media_address /
; external_signaling_address / local_net cuando SIP_EXTERNAL_ADDRESS está
; seteado. Sin eso Asterisk anuncia en el SDP la IP de su contenedor
; (10.0.x.x), que ningún softphone de la red puede alcanzar: la llamada se
; establece pero no hay audio en ninguna dirección.
${SIP_NAT_SETTINGS}

;------------------------------------------------------------------------------
; Plantillas reutilizables
;------------------------------------------------------------------------------
[endpoint-softphone](!)
type = endpoint
context = callbot-inbound
disallow = all
allow = ulaw
allow = alaw
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes

[auth-userpass](!)
type = auth
auth_type = userpass

[aor-single](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

;------------------------------------------------------------------------------
; Softphone 1 - usalo para recibir las llamadas del bot en desarrollo
;   Usuario: softphone-1   Password: ${SOFTPHONE_PASSWORD}   Servidor: IP_DEL_HOST
;------------------------------------------------------------------------------
[softphone-1](endpoint-softphone)
auth = softphone-1
aors = softphone-1
callerid = Softphone 1 <1001>

[softphone-1](auth-userpass)
password = ${SOFTPHONE_PASSWORD}
username = softphone-1

[softphone-1](aor-single)

;------------------------------------------------------------------------------
; Softphone 2 - segundo cliente de prueba
;------------------------------------------------------------------------------
[softphone-2](endpoint-softphone)
auth = softphone-2
aors = softphone-2
callerid = Softphone 2 <1002>

[softphone-2](auth-userpass)
password = ${SOFTPHONE_PASSWORD}
username = softphone-2

[softphone-2](aor-single)

;------------------------------------------------------------------------------
; TRONCAL SIP (producción)
;
; El entrypoint rellena esto cuando TRUNK_HOST está seteado. Antes estaba todo
; comentado y había que editar la plantilla a mano, con lo cual cargar las
; variables del .env no alcanzaba y no era evidente por qué.
;
; Con la troncal arriba, poner en el .env:
;   ASTERISK_DIAL_TEMPLATE=PJSIP/{number}@trunk-proveedor
; El número llega en E.164 sin el '+' (595976953263). Si el proveedor espera
; formato nacional, la plantilla se ajusta ahí, no acá.
;------------------------------------------------------------------------------
${TRUNK_SETTINGS}
